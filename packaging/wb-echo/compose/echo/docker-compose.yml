# Base compose for wb-echo (design.md §3.10).
#
# Second-service proof (issue #7): a minimal utility service declared purely by
# the template — base compose + wb.* labels — with NO bespoke lifecycle logic.
# It is brought up, proxied, gated and torn down by the same shared helper that
# manages Node-RED, so its package ships only this file plus thin sh glue.
#
# Package-owned base layer, installed to /usr/lib/wb-docker-app/echo/ and freely
# overwritten on upgrade. The user layer (docker-compose.override.yml, .env,
# data/) is seeded only-if-absent to /mnt/data/wb-docker-apps/echo/ by the
# helper and merged on top at runtime (`-f base -f override`). The wb.* labels
# are the single source of truth the helper reads (descriptor reader) to render
# the nginx block and list installed apps.
#
# A distinct wb.proxy.port (8080, vs Node-RED's 1880) keeps the two services'
# nginx server-blocks on different public ports; the helper allocates a distinct
# internal loopback port per app, so the two never collide.
services:
  echo:
    image: registry.wirenboard.com/wb/echo:1.0.0-wb1
    restart: unless-stopped
    networks: [wb]
    ports:
      - "127.0.0.1:${WB_INTERNAL_PORT:-28080}:8080"
    volumes:
      - /mnt/data/wb-docker-apps/echo/data:/data
    labels:
      wb.app: echo
      wb.title: "Echo"
      wb.proxy.port: "8080"
      wb.proxy.role: admin

networks:
  wb:
    external: true
