# Reverse-proxy for Node-RED on its own public port, behind the WB homeui login.
#
# Standalone server block: installed to /etc/nginx/sites-available/ and symlinked
# into sites-enabled/ via dh_link (the WB pattern, cf. wb-mqtt-alice-proxy). It
# must NOT go in /etc/nginx/includes/default.wb.d/ — that path is included INSIDE
# the homeui server block and only accepts location/directive additions, not a
# standalone server (controller-validated; see docs/adr/0005).
server {
    listen 0.0.0.0:1880;

    # Reuse the homeui login. auth_request resolves /auth/check WITHIN this server
    # block, so we define our own internal copy here, proxying to the global
    # wb-homeui-back upstream (declared http-level in the homeui config, visible
    # to every server block).
    location = /auth/check {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Required-User-Type $required_user_type;
        proxy_set_header X-Original-Method $request_method;
        proxy_pass http://wb-homeui-back/auth/check;
    }

    # Not logged in -> homeui login form. $host carries NO port, so the redirect
    # lands on the homeui origin (80/443), not back on :1880 (no redirect loop).
    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 $scheme://$host/login/?return_to=$scheme://$http_host$request_uri;
    }

    location / {
        set $required_user_type "admin";   # Node-RED is RCE-capable
        auth_request /auth/check;

        proxy_pass http://127.0.0.1:21880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
