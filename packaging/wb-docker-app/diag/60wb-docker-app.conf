# wb-docker-app: wb-diag-collect drop-in (design.md §3.5.1, issue #5).
#
# Makes containerized services first-class in the diagnostic archive: a support
# engineer pulling a wb-diag-collect archive sees each wb-docker-app service's
# systemd status and recent journal logs, exactly as they see native WB
# services.
#
# Shape mirrors the wb-diag-collect main config
# (/usr/share/wb-diag-collect/wb-diag-collect.conf): top-level `journald_logs`,
# `commands` and `files` keys, with `commands` entries being
# {filename, command} pairs whose stdout is archived under `<filename>.log`.
#
# NOTE: the released wb-diag-collect reads ONLY the single main config
# (/usr/share/wb-diag-collect/wb-diag-collect.conf, upstream DEFAULT_CONF_PATH)
# and has no conf.d merge yet, so this fragment is NOT read on its own. To
# actually satisfy issue #5 on a current controller, the helper's postinst
# registers the `commands` entry below into that main config (and the prerm
# removes it on uninstall) — see src/wb_docker_app/diag.py. This file stays as
# the canonical description of what gets registered, and becomes the live config
# directly once upstream gains a conf.d merge (then the postinst merge retires).
# Independently, the `wb-*.service` glob already in the main config's
# journald_logs picks up wb-docker-app@<app>.service journals; the registered
# command adds the per-service `systemctl status` + grouped logs view.

journald_logs:
  # wb-docker-app@<app>.service journals (already covered by the main config's
  # `wb-*.service`, restated here so this drop-in is self-contained).
  names:
    - wb-docker-app@*.service

commands:
  # Per-service `systemctl status` and recent logs for every running app,
  # discovered from container `wb.app` labels (same source as the CLI verbs).
  - filename: service/wb-docker-app
    command: /usr/lib/wb-docker-app/diag/wb-docker-app-diag-collect
